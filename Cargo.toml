[package]
name = "tachyonterm"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.29.0", features = ["crossterm"] }
crossterm = "0.28.1"
tokio = { version = "1.41.1", features = ["full"] }
portable-pty = "0.8.1"
tui-textarea = "0.7.0"
anyhow = "1.0.93"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
toml = "0.8"
vt100 = "0.15"
